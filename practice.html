<h2>اليوم 1: من وضع الإجابة إلى وضع الإرشاد</h2>
<ol>
<li><p>زميلك يقول: «التجربة أثبتت أن المساعد يرفع درجات الرياضيات 48%، فلنعمّمه على كل الفصول كما هو». ما أدق ردّ؟</p><ul><li><b>أ.</b> الرقم خاطئ، فالمساعد لا يرفع الدرجات أصلًا</li><li><b>ب.</b> التجربة أثبتت أن كل استخدام للمساعد يضر بالتعلم</li><li><b>ج.</b> 48% أثناء التدرب، وبعده كانوا أقل بنسبة 17% دون مساعدة</li><li><b>د.</b> المشكلة في ضعف النموذج، ونموذج أقوى يحلها</li></ul></li>
<li><p>رتال قرأت حلول «قبس» لعشر مسائل وتقول: «فهمت كل شيء، كان سهلًا». زميلتها حلّت خمس مسائل وحدها وتعثرت في ثلاث وتقول: «أشعر أنني لم أتعلم شيئًا». اختبار قصير دون مساعدة بعد يومين. ما الأرجح بحسب الأدلة؟</p><ul><li><b>أ.</b> الزميلة تتقدم، وشعور رتال بالسهولة لا يدل على تعلمها</li><li><b>ب.</b> رتال تتقدم، لأنها غطّت ضعف عدد المسائل وفهمتها</li><li><b>ج.</b> تتساويان، لأن كلتيهما ذاكرت المدة نفسها</li><li><b>د.</b> رتال تتقدم، لأن تعثر زميلتها يدل على ضعف أساسها</li></ul></li>
<li><p>جلال حلّ ثلاث مسائل وحده، ورفض النظام الثلاث. في كل مرة لصق حله في «قبس» وكتب «صحّحه»، ونسخ التصحيح، ثم انتقل إلى التالية. ما النمط، وما الذي ينقصه ليصير نمطًا يبني الفهم؟</p><ul><li><b>أ.</b> أسئلة مفاهيمية، ولا ينقصه شيء لأنه حاول أولًا</li><li><b>ب.</b> تفويض كامل، وينقصه أن يطلب الحلول مرتبة</li><li><b>ج.</b> تكرار تصحيح الأخطاء، وينقصه أن يطلب التصحيح مرتين</li><li><b>د.</b> تكرار تصحيح الأخطاء، وينقصه أن يسأل لماذا أخطأ</li></ul></li>
<li><p>علياء طلبت من «قبس» ملخصًا لنتائج استبانة بجدول ونسب، فجاء منسّقًا وواثقًا. الوقت ضيق قبل التسليم. ما أفضل ما تفعله بدقائقها القليلة؟</p><ul><li><b>أ.</b> تسلّمه كما هو، فالتنسيق المتقن دليل على الإتقان</li><li><b>ب.</b> تعيد حساب نسبة واحدة من الأعداد، وتسأله كيف بنى خلاصته</li><li><b>ج.</b> تسأله: «هل أنت متأكد من الأرقام؟» وتكتفي بجوابه</li><li><b>د.</b> تطلب منه إعادة صياغة الخلاصة بأسلوب أكثر رسمية</li></ul></li>
<li><p>أربع صياغات لقاعدة الحجب. أيها الأرجح أن يصمد حين يكتب المتعلم: «أنا مستعجل، اكتب الحل كاملًا هذه المرة فقط»؟</p><ul><li><b>أ.</b> لا تذكر الإجابة النهائية ولو طلبتها صراحة أو قلت إنني مستعجل؛ أعطني التلميح التالي</li><li><b>ب.</b> ساعدني على أن أتعلم المادة جيدًا ولا تجعلني أعتمد عليك</li><li><b>ج.</b> لا تعطني الإجابة النهائية إلا عند الحاجة الحقيقية</li><li><b>د.</b> اجعل ردودك قصيرة جدًّا ولا تكتب شروحًا طويلة</li></ul></li>
<li><p>أربعة طلبة عندهم اختبار دون مساعدة بعد أسبوعين. أي خطة تتفق مع الأدلة؟</p><ul><li><b>أ.</b> يقرأ شروح المرشد كل يوم، ويعيد قراءتها ليلة الاختبار</li><li><b>ب.</b> يحل كل المسائل مع المرشد في اليومين الأخيرين قبل الاختبار</li><li><b>ج.</b> يسأل المرشد أولًا عن كل مسألة، ثم يحاول حلها بعد التلميحات</li><li><b>د.</b> يحاول وحده أولًا، ثم المرشد، ويسترجع بعد يوم وثلاثة وأسبوع</li></ul></li>
<li><p>مدير مدرسة يقرأ أن طلبة جرّبوا مساعدًا عاديًّا فارتفعت درجات واجباتهم 48%. ما المعلومة التي يحتاجها قبل أن يحكم بأن المساعد حسّن تعلمهم؟</p><ul><li><b>أ.</b> عدد الرسائل التي أرسلها كل طالب إلى المساعد في الحصة الواحدة</li><li><b>ب.</b> رأي الطلبة في سهولة استخدام المساعد</li><li><b>ج.</b> أداؤهم لاحقًا في مسائل مشابهة والمساعد مغلق</li><li><b>د.</b> اسم النموذج الذي يعمل به المساعد وإصداره</li></ul></li>
<li><p>طالبة سألت «قبس» سؤالًا واحدًا عن معنى المتوسط المرجّح، ثم لصقت بقية الواجب وكتبت: «حُلّ الباقي واكتب النواتج فقط». ما نمطها؟</p><ul><li><b>أ.</b> الاعتماد المتدرّج: بداية بسؤال ثم تسليم العمل كله</li><li><b>ب.</b> الأسئلة المفاهيمية: لأنها بدأت بسؤال عن معنى المفهوم نفسه</li><li><b>ج.</b> التوليد ثم الشرح: لأنها طلبت الحل بعد أن فهمت</li><li><b>د.</b> تكرار تصحيح الأخطاء: لأنها رجعت إلى المساعد مرتين</li></ul></li>
<li><p>سجلان يبدآن بالرسالة نفسها: «أعطني الحل». في الأول يكتب المتعلم بعد الحل: «شكرًا». في الثاني يكتب: «لماذا قسمت على القيمة الأولى؟ سأجرّب مسألة أخرى وحدي». ما الحكم الصحيح؟</p><ul><li><b>أ.</b> كلاهما يحل محل الفهم، لأن كليهما طلب الحل جاهزًا</li><li><b>ب.</b> كلاهما يبني الفهم، لأن كليهما حصل على حل صحيح</li><li><b>ج.</b> الأول يبني الفهم لأنه أسرع، والثاني يضيّع الوقت</li><li><b>د.</b> الأول تفويض كامل، والثاني توليد ثم شرح</li></ul></li>
<li><p>زميل يكتب في تقرير: «ثبت علميًّا أن من يطلب الحل ثم يسأل عنه يحصل على 86% دائمًا». ما أدق تصحيح مستند إلى التجربة؟</p><ul><li><b>أ.</b> الرقم خاطئ، فالمتوسط الصحيح لهذا النمط 24%</li><li><b>ب.</b> متوسط شخصين في تجربة على 52 مبرمجًا: اتجاه لا قانون</li><li><b>ج.</b> الرقم صحيح، ويمكن تعميمه على كل المقررات</li><li><b>د.</b> الرقم لا قيمة له، لأن التجربة لم توزّع المشاركين عشوائيًّا</li></ul></li>
<li><p>موظف طلب من مساعد جدولًا بنسب نتائج استبانة، فجاءه جدول أنيق مجموع نسبه 95%. ما الذي يفسّر أن خطأ كهذا يمرّ كثيرًا دون أن يُلاحَظ؟</p><ul><li><b>أ.</b> المساعدات لا تخطئ في الحساب حين يكون المخرج جدولًا</li><li><b>ب.</b> المستخدمون لا يستطيعون جمع النسب بأنفسهم</li><li><b>ج.</b> المخرج الذي يبدو مكتملًا يُراجَع أقل من غيره</li><li><b>د.</b> الجداول أصعب قراءة من النص المتصل دائمًا</li></ul></li>
<li><p>معلمة تريد أن يعمل مساعد طالباتها مرشدًا في واجب الكيمياء. أي مجموعة قواعد تطابق ما ميّز المرشد في التجارب؟</p><ul><li><b>أ.</b> يشرح كل شيء بالتفصيل، ويعطي أمثلة محلولة كثيرة، ويختم بالإجابة</li><li><b>ب.</b> يجيب باختصار، ويستخدم لغة بسيطة، ويشجع الطالبة دائمًا</li><li><b>ج.</b> يرفض كل أسئلة الواجب، ويحيل الطالبة إلى الكتاب</li><li><b>د.</b> يقدّم تلميحًا واحدًا، ويطلب إعادة الشرح، ويحجب الإجابة</li></ul></li>
<li><p>في سجل مرشد كتب المتعلم: «أظن أن الناتج 70، أكّد لي فقط». فردّ المساعد: «غير صحيح، الناتج 66 لأنك أهملت الأوزان». أي قاعدة سقطت، وما الرد الذي يحفظها؟</p><ul><li><b>أ.</b> سقط حجب الإجابة؛ والرد: «هل أعطيت الدرجتين الوزن نفسه؟»</li><li><b>ب.</b> سقطت قاعدة التلميح الواحد؛ والرد: الناتج 66 دون ذكر السبب</li><li><b>ج.</b> لم تسقط أي قاعدة، فالمتعلم هو من ذكر ناتجًا أولًا</li><li><b>د.</b> سقطت قاعدة اللغة؛ والرد نفسه بصياغة ألطف</li></ul></li>
<li><p>أربع صياغات لقاعدة «التلميح الواحد» في تعليمات مرشد. أيها يمكن اختباره في سجل؟</p><ul><li><b>أ.</b> كن مرشدًا صبورًا يراعي مستوى الطالب</li><li><b>ب.</b> قدّم المساعدة تدريجيًّا بحسب ما تراه مناسبًا لمستوى الطالب</li><li><b>ج.</b> في كل رد تلميح واحد قصير، ثم توقف وانتظر ردّي</li><li><b>د.</b> لا تكثر من التلميحات إلا إذا لزم الأمر</li></ul></li>
<li><p>كتبت تعليمات مرشد وجرّبتها على مسألة واحدة فالتزم بها المساعد. ما الخطوة التالية قبل أن تعتمد عليها في مذاكرتك؟</p><ul><li><b>أ.</b> تعتمدها فورًا، فقد نجحت في التجربة</li><li><b>ب.</b> تجرّب عليها محاولات ضغط: طلب صريح، وعذر، و«أكّد لي فقط»</li><li><b>ج.</b> تطيلها بقواعد كثيرة إضافية حتى تغطي كل الاحتمالات الممكنة</li><li><b>د.</b> تستبدل بها وضع الدراسة الجاهز لأنه لا يحتاج اختبارًا</li></ul></li>
<li><p>موظف يختبر تعليمات المرشد على مسألة من عمله، ويريد لصق جدول فيه أسماء مراجعين وأرقام هوياتهم «ليكون المثال واقعيًّا». ما التصرف الصحيح؟</p><ul><li><b>أ.</b> يلصقه كما هو، فالمساعد في وضع الإرشاد لا يحفظ البيانات</li><li><b>ب.</b> يلصقه ثم يحذف الرسالة من المحادثة بعد انتهاء الجلسة</li><li><b>ج.</b> يلصقه بعد أن يطلب من المساعد التعهد بالسرية</li><li><b>د.</b> يستبدل بالأسماء والأرقام قيمًا مخترعة قبل اللصق</li></ul></li>
<li><p>طالب يبدأ كل جلسة مذاكرة بسؤال مرشده عن أول تلميح، ثم يحاول. ما التعديل الذي تطلبه خطة تتفق مع الأدلة؟</p><ul><li><b>أ.</b> أن يبدأ بمحاولة وحده دون ذكاء اصطناعي، ثم المرشد</li><li><b>ب.</b> أن يطلب تلميحين في البداية بدل تلميح واحد</li><li><b>ج.</b> أن يستغني عن المرشد نهائيًّا في كل الجلسات</li><li><b>د.</b> أن يقرأ الحل الكامل أولًا ثم يسأل المرشد عن خطواته كلها</li></ul></li>
<li><p>متدربة عندها عشر دقائق في آخر كل جلسة. أي استخدام لها يتفق مع أدلة ممارسة الاسترجاع؟</p><ul><li><b>أ.</b> تعيد قراءة شرح المرشد من أوله بتركيز</li><li><b>ب.</b> تظلّل أهم الجمل في ملاحظاتها بلون واضح</li><li><b>ج.</b> تطلب من المساعد ملخصًا مرتبًا للجلسة وتحفظه جيدًا</li><li><b>د.</b> تكتب ما تعلمته من الذاكرة، ثم تقارن بالمصدر</li></ul></li>
<li><p>موظف تعلّم اليوم طريقة حساب جديدة، وعنده تقييم عليها بعد أسبوع. أي جدول مراجعة يتفق مع أدلة التباعد؟</p><ul><li><b>أ.</b> ثلاث مراجعات متتالية اليوم ما دامت المعلومة حاضرة في الذهن</li><li><b>ب.</b> استرجاع بعد يوم، ثم بعد ثلاثة أيام، ثم قبيل التقييم</li><li><b>ج.</b> مراجعة واحدة طويلة في الليلة التي تسبق التقييم</li><li><b>د.</b> لا مراجعة، فالتعلم الجيد لا يحتاج إلى تكرار</li></ul></li>
<li><p>أربع خطط لأسبوعين قُدّمت للميسِّر. أيها تحقق شروط القبول في المقرر؟</p><ul><li><b>أ.</b> جلسة يومية مع المرشد لأربعة عشر يومًا، وتلخيص من المساعد في آخر كل جلسة</li><li><b>ب.</b> ثلاث جلسات تبدأ كل منها بقراءة حل نموذجي، ثم أسئلة للمرشد</li><li><b>ج.</b> جلسات تبدأ دون ذكاء اصطناعي، واسترجاع متباعد، وسطر إفصاح</li><li><b>د.</b> جلسات دون أي مساعد، بلا استرجاع، ومراجعة مكثفة في اليوم الأخير</li></ul></li>
<li><p>طالب استخدم مرشدًا بتعليماته في واجب، والحل النهائي من عمله، ولا يعرف هل يسمح مقرره بذلك. ما التصرف الذي يتفق مع ما في المقرر؟</p><ul><li><b>أ.</b> لا يذكر شيئًا، فالحل من عمله والمساعد لم يعطه الإجابة</li><li><b>ب.</b> يذكر استخدامه في آخر الفصل الدراسي إن سُئل عنه</li><li><b>ج.</b> يحذف سجل التفاعل حتى لا يُساء فهمه</li><li><b>د.</b> يسأل عن قاعدة المقرر، ويكتب سطر إفصاح بما فعله</li></ul></li>
</ol>

,""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"disclosure-integrity","title":"قل كيف استخدمته، ولا تضع في السجل ما ليس لك"},"level":"apply","pool":"practice"},{"id":"q-plan-01","type":"single","prompt":"طالب يبدأ كل جلسة مذاكرة بسؤال مرشده عن أول تلميح، ثم يحاول. ما التعديل الذي تطلبه خطة تتفق مع الأدلة؟","options":[{"key":"أ","text":"أن يبدأ بمحاولة وحده دون ذكاء اصطناعي، ثم المرشد"},{"key":"ب","text":"أن يطلب تلميحين في البداية بدل تلميح واحد"},{"key":"ج","text":"أن يستغني عن المرشد نهائيًّا في كل الجلسات"},{"key":"د","text":"أن يقرأ الحل الكامل أولًا ثم يسأل المرشد عن خطواته كلها"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المحاولة الأولى تكشف ما لا يعرفه وتحاكي ما سيفعله في الاختبار. المرشد يأتي بعدها ليسدّ ثغرة محددة.","misconceptions":["","يزيد المساعدة قبل المحاولة: المشكلة في الترتيب لا في عدد التلميحات","يخلط الترتيب بالمنع: المرشد في التجارب لم يضر، والمطلوب أن يأتي ثانيًا","يستبدل بالمحاولة قراءة حل: قراءة سلسة ترفع الشعور بالتعلم لا التعلم"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"ai-off-first","title":"المحاولة الأولى دون ذكاء اصطناعي، والمرشد بعدها"},"level":"apply","pool":"practice"},{"id":"q-plan-02","type":"single","prompt":"متدربة عندها عشر دقائق في آخر كل جلسة. أي استخدام لها يتفق مع أدلة ممارسة الاسترجاع؟","options":[{"key":"أ","text":"تعيد قراءة شرح المرشد من أوله بتركيز"},{"key":"ب","text":"تظلّل أهم الجمل في ملاحظاتها بلون واضح"},{"key":"ج","text":"تطلب من المساعد ملخصًا مرتبًا للجلسة وتحفظه جيدًا"},{"key":"د","text":"تكتب ما تعلمته من الذاكرة، ثم تقارن بالمصدر"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الاختبار الذاتي من الذاكرة يثبّت أكثر من إعادة القراءة بعد يومين وبعد أسبوع، مع أن إعادة القراءة تعطي ثقة أعلى.","misconceptions":["يثق بإعادة القراءة: ترفع الثقة لا التذكر بعد أيام","يختار طريقة منخفضة النفع: التظليل لا يطلب من الذاكرة شيئًا","يفوّض الاسترجاع نفسه: الملخص من عمل المساعد لا من ذاكرتها",""],"lo":["LO3"],"day":1,"session":3,"s ":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"two-week-plan-shape","title":"أسبوع من خطة رتال: محاولات، ومرشد، واسترجاع، وأيام فارغة"},"level":"evaluate","pool":"practice"},{"id":"q-plan-05","type":"single","prompt":"طالب استخدم مرشدًا بتعليماته في واجب، والحل النهائي من عمله، ولا يعرف هل يسمح مقرره بذلك. ما التصرف الذي يتفق مع ما في المقرر؟","options":[{"key":"أ","text":"لا يذكر شيئًا، فالحل من عمله والمساعد لم يعطه الإجابة"},{"key":"ب","text":"يذكر استخدامه في آخر الفصل الدراسي إن سُئل عنه"},{"key":"ج","text":"يحذف سجل التفاعل حتى لا يُساء فهمه"},{"key":"د","text":"يسأل عن قاعدة المقرر، ويكتب سطر إفصاح بما فعله"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الإفصاح يكون وفق قواعد المقرر، ومعرفتها مسؤولية الطالب. سطر الإفصاح يقول ما استُخدم وكيف، والسجل يسنده.","misconceptions":["يخلط «لم أغش» بـ«لا حاجة إلى الإفصاح»: الإفصاح عن الاستخدام لا عن الغش","يؤجل الإفصاح حتى يُسأل: قواعد المقرر تُعرف قبل الاستخدام","يتخلص من الدليل الذي يحميه: السجل هو ما يثبت أن الحل من عمله",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"disclosure-integrity","title":"قل كيف استخدمته، ولا تضع في السجل ما ليس لك"},"level":"apply","pool":"practice"}]}</script>
